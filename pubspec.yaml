name: smart_road_monitor
description: Vibration-based pothole detection mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^4.0.2          # accelerometer access
  geolocator: ^11.0.0           # GPS distance tracking
  http: ^1.2.1                  # HTTP POST to Flask
  permission_handler: ^11.3.1   # runtime permissions

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
